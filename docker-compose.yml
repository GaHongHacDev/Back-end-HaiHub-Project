version: '3.4'

services:
  hairhub.api:
    container_name: hairhub-api-new
    build:
      context: .
      dockerfile: Hairhub.API/Dockerfile
    image: hairhubapi
    networks:
      - demo
    ports:
      - "8444:443"  # Cổng HTTPS
      - "8085:80"   # Cổng HTTP (nếu cần)
    environment:
      # - ASPNETCORE_URLS=http://+:8085
      # - ConnectionStrings__DefaultConnection=Server=160.187.240.158,1455;Database=HairHubDB;User Id=sa;Password=GaDev#32;
      - TZ=Asia/Ho_Chi_Minh
    restart: always
    # volumes:
    #   - /root/.aspnet/https:/https:ro
networks:
  demo:
    driver: bridge
